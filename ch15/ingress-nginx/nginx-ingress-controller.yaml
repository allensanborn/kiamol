# Traefik v3 serving the chapter's "nginx" Ingresses through its ingress-nginx
# provider, which translates nginx.ingress.kubernetes.io annotations.
# ingress-nginx itself was archived in 2026; names here match the book's
# commands (namespace, Service and Deployment), so they work unchanged.
# Not translated by Traefik: proxy_cache in configuration-snippet, so the
# caching exercise serves uncached responses; /etc/nginx/nginx.conf does not exist.
apiVersion: v1
kind: Namespace
metadata:
  name: kiamol-ingress-nginx
  labels:
    kiamol: ch15
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: k8s.io/ingress-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: kiamol-ingress-nginx
spec:
  type: LoadBalancer
  selector:
    app: ingress-nginx-controller
  ports:
    - name: http
      port: 80
      targetPort: web
    - name: https
      port: 443
      targetPort: websecure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-nginx-controller
  namespace: kiamol-ingress-nginx
spec:
  selector:
    matchLabels:
      app: ingress-nginx-controller
  template:
    metadata:
      labels:
        app: ingress-nginx-controller
    spec:
      serviceAccountName: ingress-nginx
      containers:
        - name: controller
          image: traefik:v3.7.17
          args:
            - --providers.kubernetesingressnginx
            - --providers.kubernetesingressnginx.watchingresswithoutclass=true
            - --providers.kubernetesingressnginx.publishservice=kiamol-ingress-nginx/ingress-nginx-controller
            - --providers.kubernetesingressnginx.allowsnippetannotations=true
            - --entryPoints.web.address=:80
            - --entryPoints.websecure.address=:443
          ports:
            - name: web
              containerPort: 80
            - name: websecure
              containerPort: 443
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-nginx
  namespace: kiamol-ingress-nginx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kiamol-ingress-nginx
rules:
  - apiGroups: [""]
    resources: [services, secrets, configmaps, namespaces]
    verbs: [list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiamol-ingress-nginx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kiamol-ingress-nginx
subjects:
  - kind: ServiceAccount
    name: ingress-nginx
    namespace: kiamol-ingress-nginx
