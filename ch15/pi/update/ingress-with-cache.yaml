apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pi
  labels:
    kiamol: ch15
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "on" 
    # proxy_cache snippet removed: Traefik's ingress-nginx provider rejects the route
    # when it sees proxy_cache, and has no response cache, so this serves uncached.
spec:
  rules:
  - host: pi.kiamol.local
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: pi-web
            port:
              number: 80