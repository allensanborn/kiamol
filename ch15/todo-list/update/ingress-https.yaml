apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-new
  labels:
    kiamol: ch15
  annotations:
    nginx.ingress.kubernetes.io/affinity: cookie
spec:
  rules:
  - host: todo.kiamol.local
    http:
      paths:
      - pathType: Exact
        path: /new
        backend:
          service:
            name: todo-web
            port:
              number: 80
  tls:
   - secretName: kiamol-cert
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-static
  labels:
    kiamol: ch15
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "on" 
    # proxy_cache snippet removed: Traefik's ingress-nginx provider rejects the route
    # when it sees proxy_cache, and has no response cache, so this serves uncached.
spec:
  rules:
  - host: todo.kiamol.local
    http:
      paths:
      - pathType: Prefix
        path: /static
        backend:
          service:
            name: todo-web
            port:
              number: 80
  tls:
   - secretName: kiamol-cert
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo
  labels:
    kiamol: ch15
spec:
  rules:
  - host: todo.kiamol.local
    http:
      paths:
      - pathType: Exact
        path: /
        backend:
          service:
            name: todo-web
            port:
              number: 80
      - pathType: Exact
        path: /list
        backend:
          service:
            name: todo-web
            port:
              number: 80
  tls:
   - secretName: kiamol-cert