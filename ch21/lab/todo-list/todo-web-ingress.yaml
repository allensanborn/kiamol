apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-web
  namespace: todo
  labels:
    kiamol: ch21-lab
  annotations:
    kubernetes.io/ingress.class: contour-external
spec:
  rules:
  - host: todo.kiamol.local
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: todo-web
            port:
              number: 80